<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSketch 3D - Akuarium Frutiger Aero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Font Inter & Quicksand untuk nuansa Aero yang ramah dan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Kustomisasi Gaya Frutiger Aero & Glassmorphism */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
        }

        h1, h2, .aero-title {
            font-family: 'Quicksand', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Latar Belakang Laut Frutiger Aero yang adem dan mendalam */
            background: radial-gradient(ellipse at 50% 0%, #248a94 0%, #005478 42%, #002e4d 80%, #001729 100%);
        }

        /* Panel Glassmorphism khas Frutiger Aero */
        .aero-glass {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.52) 0%,
                rgba(235, 250, 255, 0.28) 50%,
                rgba(200, 242, 255, 0.4) 100%
            );
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.78);
            box-shadow: 
                0 8px 32px rgba(0, 38, 68, 0.3),
                inset 0 2px 3px rgba(255, 255, 255, 0.85),
                inset 0 -2px 5px rgba(0, 120, 180, 0.18);
        }

        /* Tombol Glossy (Kilau Kaca ala Windows Vista / 7) */
        .aero-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.82) 0%,
                rgba(255, 255, 255, 0.38) 48%,
                rgba(255, 255, 255, 0.18) 52%,
                rgba(255, 255, 255, 0.48) 100%
            );
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 4px 12px rgba(0, 50, 90, 0.22),
                inset 0 1px 1px rgba(255, 255, 255, 0.95);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        .aero-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 18px rgba(0, 180, 255, 0.45),
                inset 0 1px 2px rgba(255, 255, 255, 1);
            border-color: #ffffff;
        }

        .aero-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        /* Tombol Utama Hijau Segar / Aqua Glossy */
        .aero-btn-primary {
            background: linear-gradient(
                180deg,
                #8ef07d 0%,
                #4cd946 48%,
                #28b824 52%,
                #5ce656 100%
            );
            border: 1.5px solid #d4ffd1;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 75, 10, 0.6);
            box-shadow: 
                0 5px 15px rgba(40, 184, 36, 0.4),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.9);
        }

        .aero-btn-primary:hover {
            box-shadow: 
                0 7px 22px rgba(76, 217, 70, 0.65),
                inset 0 1.5px 2px rgba(255, 255, 255, 1);
        }

        /* Tombol Aksi Biru Aqua */
        .aero-btn-aqua {
            background: linear-gradient(
                180deg,
                #7ce8ff 0%,
                #1ec8f5 48%,
                #009fd4 52%,
                #3cd4fc 100%
            );
            border: 1.5px solid #d6f8ff;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 55, 95, 0.6);
            box-shadow: 
                0 5px 15px rgba(0, 159, 212, 0.38),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.9);
        }

        /* Tombol Bahaya / Reset Merah Koral */
        .aero-btn-danger {
            background: linear-gradient(
                180deg,
                #ff9a9e 0%,
                #ff5e62 48%,
                #e0353b 52%,
                #ff7579 100%
            );
            border: 1.5px solid #ffd6d8;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(100, 0, 10, 0.5);
        }

        /* Swatch Warna Glossy Bulat seperti Orbs Frutiger Aero */
        .color-orb {
            border-radius: 9999px;
            position: relative;
            box-shadow: 
                0 3px 6px rgba(0, 0, 0, 0.2),
                inset 0 2px 3px rgba(255, 255, 255, 0.85),
                inset 0 -2px 4px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .color-orb::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 20%;
            width: 60%;
            height: 32%;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 100%);
        }

        .color-orb.active {
            transform: scale(1.22);
            box-shadow: 
                0 0 0 3px #ffffff,
                0 4px 10px rgba(0, 140, 255, 0.5),
                inset 0 2px 3px rgba(255, 255, 255, 0.9);
        }

        /* Animasi Modal */
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-animate {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Kanvas Gambar dengan Pola Kotak Transparan Halus */
        .drawing-board-bg {
            background-color: rgba(255, 255, 255, 0.92);
            background-image: 
                radial-gradient(rgba(0, 168, 232, 0.16) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- Container Utama Akuarium 3D Three.js -->
    <div id="aquarium3DContainer" class="block w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- HUD Atas: Judul & Info -->
    <header class="fixed top-3 left-3 right-3 sm:top-4 sm:left-5 sm:right-5 flex flex-wrap items-center justify-between gap-2 pointer-events-none z-10">
        <!-- Logo / Badge Judul -->
        <div class="aero-glass rounded-full px-4 py-2 sm:px-5 sm:py-2.5 flex items-center gap-2.5 pointer-events-auto">
            <div class="w-8 h-8 rounded-full bg-gradient-to-b from-cyan-200 to-blue-600 border border-white flex items-center justify-center shadow-inner text-white">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
                    <path d="M18 12v.5"/>
                    <path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/>
                    <path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/>
                </svg>
            </div>
            <div>
                <h1 class="aero-title text-sm sm:text-lg font-bold text-sky-950 leading-tight drop-shadow-sm">
                    AquaSketch <span class="text-sky-700 font-semibold">3D Aero</span>
                </h1>
                <p id="headerSubtitle" class="text-[11px] sm:text-xs text-sky-900/85 font-medium hidden sm:block">
                    Seret putar • Klik ikan ikuti • Klik air beri makan
                </p>
            </div>
        </div>

        <!-- Penghitung Ikan, Ikuti Ikan, Reset Kamera & Tombol Suara -->
        <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto">
            <div class="aero-glass rounded-full px-3 py-2 flex items-center gap-1.5 text-sky-950 font-semibold text-xs sm:text-sm">
                <svg class="w-4 h-4 text-sky-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/>
                    <path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/>
                </svg>
                <span id="fishCount" class="bg-white/75 px-2 py-0.5 rounded-full text-sky-800 font-bold shadow-inner">0</span>
            </div>

            <button id="followFishBtn" title="Ikuti Ikan" class="aero-btn rounded-full px-3 h-10 flex items-center justify-center gap-1.5 text-sky-950 font-semibold text-xs sm:text-sm">
                <svg class="w-4 h-4 text-sky-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                </svg>
                <span id="followFishLabel" class="hidden sm:inline">Ikuti</span>
            </button>

            <button id="resetCamBtn" title="Reset Kamera" class="aero-btn rounded-full px-3 h-10 flex items-center justify-center gap-1.5 text-sky-950 font-semibold text-xs sm:text-sm">
                <svg class="w-4 h-4 text-sky-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                <span class="hidden md:inline">Reset</span>
            </button>

            <button id="toggleSoundBtn" title="Suara" class="aero-btn rounded-full w-10 h-10 flex items-center justify-center text-sky-950">
                <svg id="soundIconOn" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
                <svg id="soundIconOff" class="w-4 h-4 hidden text-rose-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Notifikasi Toast Melayang -->
    <div id="toastContainer" class="fixed top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none flex flex-col items-center gap-2 w-11/12 max-w-sm"></div>

    <!-- HUD Bawah: Kontrol Kolam -->
    <footer class="fixed bottom-4 left-3 right-3 sm:bottom-6 flex justify-center pointer-events-none z-10">
        <div class="aero-glass rounded-3xl sm:rounded-full p-2 sm:px-4 sm:py-2.5 flex flex-wrap items-center justify-center gap-2 sm:gap-3 pointer-events-auto shadow-xl">
            
            <!-- Tombol Gambar Ikan Baru -->
            <button id="openDrawModalBtn" class="aero-btn aero-btn-primary rounded-full px-4 py-2.5 sm:px-5 sm:py-3 font-bold text-sm flex items-center gap-1.5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                    <path d="M2 2l7.586 7.586"/>
                    <circle cx="11" cy="11" r="2"/>
                </svg>
                <span>Gambar</span>
            </button>

            <!-- Tombol Tebar Makanan -->
            <button id="dropFoodBtn" class="aero-btn aero-btn-aqua rounded-full px-4 py-2.5 sm:px-5 sm:py-3 font-semibold text-sm flex items-center gap-1.5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <circle cx="19" cy="7" r="2"/>
                    <circle cx="6" cy="17" r="2"/>
                    <circle cx="17" cy="17" r="1.5"/>
                </svg>
                <span>Makan</span>
            </button>

            <!-- Tombol Gelembung Ekstra -->
            <button id="bubbleBurstBtn" class="aero-btn rounded-full px-3.5 py-2.5 sm:px-4 sm:py-3 font-semibold text-sky-950 text-sm flex items-center gap-1.5" title="Gelembung">
                <svg class="w-4 h-4 text-sky-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="14" r="5"/>
                    <circle cx="17" cy="8" r="3"/>
                    <circle cx="16" cy="17" r="2"/>
                </svg>
                <span class="hidden sm:inline">Gelembung</span>
            </button>

            <!-- Tombol Bersihkan Kolam -->
            <button id="clearPondBtn" class="aero-btn aero-btn-danger rounded-full px-3.5 py-2.5 sm:px-4 sm:py-3 font-semibold text-sm flex items-center gap-1.5" title="Kosongkan">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                <span class="hidden md:inline">Kosongkan</span>
            </button>
        </div>
    </footer>

    <!-- Modal Kanvas Menggambar Ikan (Glassmorphism) -->
    <div id="drawingModal" class="fixed inset-0 z-40 hidden flex items-center justify-center p-3 sm:p-5 bg-sky-950/35 backdrop-blur-sm transition-opacity duration-200">
        <div class="aero-glass modal-animate rounded-3xl w-full max-w-2xl p-4 sm:p-6 flex flex-col gap-3.5 relative">
            
            <!-- Header Modal -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="aero-title text-lg sm:text-xl font-bold text-sky-950 flex items-center gap-2">
                        <svg class="w-5 h-5 text-sky-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/>
                            <path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/>
                        </svg>
                        <span>Gambar Ikan</span>
                    </h2>
                    <p class="text-xs text-sky-900/85 font-medium flex items-center gap-1 mt-0.5">
                        <span>Hadapkan kepala ke <strong>KANAN</strong></span>
                        <svg class="w-3.5 h-3.5 text-sky-800 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </p>
                </div>
                <button id="closeModalBtn" class="aero-btn rounded-full w-9 h-9 flex items-center justify-center text-sky-950 font-bold" title="Tutup">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Area Kanvas Gambar Diperluas -->
            <div class="relative w-full aspect-[16/9] rounded-2xl overflow-hidden border-2 border-white shadow-inner drawing-board-bg">
                <!-- Panduan Siluet Samar di Latar Kanvas -->
                <div id="guideOverlay" class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-25">
                    <svg viewBox="0 0 240 135" class="w-4/5 h-4/5 stroke-sky-600 fill-none" stroke-width="2" stroke-dasharray="5,5">
                        <path d="M 60,67 C 80,22 160,22 190,67 C 160,112 80,112 60,67 Z" />
                        <path d="M 60,67 L 25,35 L 35,67 L 25,99 Z" />
                        <circle cx="165" cy="55" r="7" />
                        <path d="M 200,67 L 222,67 M 212,58 L 222,67 L 212,76" stroke-width="2.5" />
                    </svg>
                </div>

                <canvas id="drawCanvas" class="w-full h-full touch-none cursor-crosshair relative z-10"></canvas>

                <!-- Tombol Toggle Panduan & Bersihkan Kanvas -->
                <div class="absolute top-2.5 right-2.5 z-20 flex gap-1.5">
                    <button id="toggleGuideBtn" class="aero-btn rounded-full px-2.5 py-1 text-xs font-semibold text-sky-900 bg-white/80 flex items-center gap-1" title="Tampilkan/Sembunyikan Panduan">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span>Panduan</span>
                    </button>
                    <button id="clearCanvasBtn" class="aero-btn rounded-full px-2.5 py-1 text-xs font-semibold text-rose-700 bg-white/80 flex items-center gap-1" title="Hapus Semua Gambar">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                        </svg>
                        <span>Hapus</span>
                    </button>
                </div>
            </div>

            <!-- Palet Warna Frutiger Aero -->
            <div class="flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-sky-950 uppercase tracking-wider">Warna & Kuas</span>
                    <!-- Ukuran Kuas -->
                    <div class="flex items-center gap-1.5 bg-white/40 px-2.5 py-1 rounded-full border border-white/60">
                        <button data-size="4" class="brush-size-btn w-6 h-6 rounded-full flex items-center justify-center hover:bg-white/60 transition" title="Kuas Kecil">
                            <span class="w-1.5 h-1.5 rounded-full bg-sky-950 block"></span>
                        </button>
                        <button data-size="9" class="brush-size-btn active bg-white/90 shadow-sm w-6 h-6 rounded-full flex items-center justify-center transition" title="Kuas Sedang">
                            <span class="w-3 h-3 rounded-full bg-sky-950 block"></span>
                        </button>
                        <button data-size="16" class="brush-size-btn w-6 h-6 rounded-full flex items-center justify-center hover:bg-white/60 transition" title="Kuas Besar">
                            <span class="w-4 h-4 rounded-full bg-sky-950 block"></span>
                        </button>
                    </div>
                </div>

                <!-- Baris Orbs Warna + Penghapus -->
                <div class="flex flex-wrap items-center justify-between gap-2 bg-white/35 p-2.5 rounded-2xl border border-white/60">
                    <div id="colorPalette" class="flex flex-wrap items-center gap-2 sm:gap-2.5">
                        <!-- Diisi otomatis via JS -->
                    </div>

                    <!-- Alat Penghapus -->
                    <button id="eraserBtn" class="aero-btn rounded-full px-3 py-1.5 text-xs font-bold text-sky-950 flex items-center gap-1.5" title="Penghapus">
                        <svg class="w-3.5 h-3.5 text-sky-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
                            <path d="M22 21H7"/>
                            <path d="m5 11 9 9"/>
                        </svg>
                        <span>Hapus</span>
                    </button>
                </div>
            </div>

            <!-- Tombol Aksi Modal -->
            <div class="flex items-center justify-end gap-2.5 pt-1">
                <button id="presetFishBtn" class="aero-btn rounded-full px-4 py-2 text-xs sm:text-sm font-semibold text-sky-950 flex items-center gap-1.5" title="Ikan Contoh">
                    <svg class="w-4 h-4 text-sky-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                    </svg>
                    <span>Contoh</span>
                </button>
                <button id="spawnFishBtn" class="aero-btn aero-btn-primary rounded-full px-5 py-2.5 text-sm font-bold flex items-center gap-1.5 flex-1 sm:flex-initial justify-center">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                        <path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                        <path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                    </svg>
                    <span>Lepaskan</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * AQUASKETCH 3D AERO - AKUARIUM 3D THREE.JS & GAMBAR IKAN INTERAKTIF
         * ============================================================================
         */

        // --- 1. SISTEM AUDIO SINTETIS (WEB AUDIO API) ---
        class AeroSoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            playBubble(pitchMultiplier = 1) {
                if (this.muted) return;
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    const startFreq = (280 + Math.random() * 180) * pitchMultiplier;
                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(startFreq * 2.1, now + 0.14);

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.16);
                } catch (e) {}
            }

            playSplashSpawn() {
                if (this.muted) return;
                try {
                    this.init();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const now = this.ctx.currentTime + i * 0.065;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();

                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now);

                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.1, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.start(now);
                        osc.stop(now + 0.36);
                    });
                } catch (e) {}
            }

            playNibble() {
                if (this.muted) return;
                this.playBubble(1.4);
            }
        }

            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (drawCanvas.width / rect.width),
                y: (clientY - rect.top) * (drawCanvas.height / rect.height)

        function startDraw(e) {
            e.preventDefault();
            isDrawing = true;

            const pos = getDrawPos(e);

            drawCtx.beginPath();

                drawCtx.arc(lastX, lastY, currentBrushSize, 0, Math.PI * 2);
                drawCtx.fill();
            } else {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.fillStyle = currentColor;
                drawCtx.arc(lastX, lastY, currentBrushSize / 2, 0, Math.PI * 2);
                drawCtx.fill();
            }
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getDrawPos(e);

            drawCtx.beginPath();
            drawCtx.moveTo(lastX, lastY);
            drawCtx.lineTo(pos.x, pos.y);
            drawCtx.lineWidth = isEraser ? currentBrushSize * 2 : currentBrushSize;

            if (isEraser) {

            } else {
                drawCtx.globalCompositeOperation = 'source-over';

            }

            drawCtx.stroke();
            lastX = pos.x;

        function extractTrimmedFishSprite() {
            if (!hasDrawnSomething) return null;
            const w = drawCanvas.width;
            const h = drawCanvas.height;
            const imgData = drawCtx.getImageData(0, 0, w, h);
            const data = imgData.data;

            let minX = w, minY = h, maxX = 0, maxY = 0;
            let found = false;

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const alpha = data[(y * w + x) * 4 + 3];
                    if (alpha > 15) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        found = true;
                    }
                }
            }

            if (!found) return null;

            const padding = 20;
            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(w, maxX + padding);
            maxY = Math.min(h, maxY + padding);

            const boxW = maxX - minX;
            const boxH = maxY - minY;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = boxW;
            tempCanvas.height = boxH;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(drawCanvas, minX, minY, boxW, boxH, 0, 0, boxW, boxH);
            return tempCanvas;
        }

        function createFrutigerAeroOceanBackground() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0.0, '#32a8b3');
            grad.addColorStop(0.24, '#116d8f');
            grad.addColorStop(0.56, '#024063');
            grad.addColorStop(0.86, '#00223b');
            grad.addColorStop(1.0, '#001222');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const sunGlow = ctx.createRadialGradient(512, 40, 10, 512, 130, 440);
            sunGlow.addColorStop(0, 'rgba(180, 245, 252, 0.28)');
            sunGlow.addColorStop(0.5, 'rgba(70, 185, 215, 0.1)');
            sunGlow.addColorStop(1, 'rgba(0, 70, 110, 0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const rayOffsets = [-280, -165, -55, 55, 165, 280];
            rayOffsets.forEach((offset, idx) => {
                const startX = 512 + offset;
                const spread = offset * 0.42;
                const rayGrad = ctx.createLinearGradient(startX, 0, startX + spread, 680);
                rayGrad.addColorStop(0, idx % 2 === 0 ? 'rgba(175, 242, 250, 0.07)' : 'rgba(175, 242, 250, 0.045)');
                rayGrad.addColorStop(1, 'rgba(175, 242, 250, 0)');
                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                ctx.moveTo(startX - 22, 0);
                ctx.lineTo(startX + 22, 0);
                ctx.lineTo(startX + spread + 65, 680);
                ctx.lineTo(startX + spread - 65, 680);
                ctx.closePath();
                ctx.fill();
            });
            ctx.restore();

            const bokehList = [
                { x: 160, y: 260, r: 34 }, { x: 240, y: 420, r: 18 }, { x: 120, y: 580, r: 26 },
                { x: 340, y: 310, r: 14 }, { x: 420, y: 510, r: 22 }, { x: 610, y: 290, r: 16 },
                { x: 700, y: 470, r: 28 }, { x: 840, y: 250, r: 36 }, { x: 790, y: 560, r: 20 },
                { x: 910, y: 410, r: 24 }, { x: 512, y: 380, r: 15 }, { x: 290, y: 670, r: 22 },
                { x: 740, y: 690, r: 19 }
            ];
            bokehList.forEach(b => {
                const bubbleGrad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
                bubbleGrad.addColorStop(0, 'rgba(215, 248, 255, 0.11)');
                bubbleGrad.addColorStop(0.75, 'rgba(90, 200, 230, 0.04)');
                bubbleGrad.addColorStop(1, 'rgba(215, 248, 255, 0.09)');
                ctx.fillStyle = bubbleGrad;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = 'rgba(0, 20, 38, 0.55)';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 16) {
                const hill = Math.sin(x * 0.0065) * 28 + Math.cos(x * 0.015) * 14;
                ctx.lineTo(x, 865 + hill);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function createCausticTexture() {

        /**
         * Membuat tekstur prosedural pasir pantai tropis krem alami (butiran halus & riak lembut)
         */
        function createTropicalSandTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Base warna pasir krem pantai tropis hangat
            ctx.fillStyle = '#f5e8cc';
            ctx.fillRect(0, 0, size, size);

            // Riak ombak pasir halus
            for (let y = 0; y < size; y += 4) {
                const waveAlpha = (Math.sin(y * 0.09) + 1) * 0.035;
                ctx.fillStyle = `rgba(218, 194, 152, ${waveAlpha})`;
                ctx.fillRect(0, y, size, 2);
            }

            // Butiran mineral pasir tropis (krem cerah, putih koral, sedikit keemasan)
            const grainColors = ['#fffaf0', '#e6d3ad', '#d9c094', '#fcf5e6'];
            for (let i = 0; i < 6500; i++) {
                const gx = Math.random() * size;
                const gy = Math.random() * size;
                const gr = 0.6 + Math.random() * 1.3;
                ctx.fillStyle = grainColors[i % grainColors.length];
                ctx.globalAlpha = 0.25 + Math.random() * 0.35;
                ctx.beginPath();
                ctx.arc(gx, gy, gr, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 3);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        /**
         * Membuat tekstur papan kayu artistik alami dengan serat & sambungan papan
         */
        function createArtisticWoodTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Base kayu jati / walnut hangat
            const baseGrad = ctx.createLinearGradient(0, 0, size, size);
            baseGrad.addColorStop(0, '#784826');
            baseGrad.addColorStop(0.5, '#8c5630');
            baseGrad.addColorStop(1, '#663a1c');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, size, size);

            // Garis sambungan papan kayu artistik (4 bilah papan)
            const planks = 4;
            const plankH = size / planks;
            for (let p = 0; p < planks; p++) {
                const py = p * plankH;
                // Variasi tone tiap bilah papan
                ctx.fillStyle = p % 2 === 0 ? 'rgba(255, 220, 180, 0.05)' : 'rgba(35, 15, 5, 0.08)';
                ctx.fillRect(0, py, size, plankH);

                // Serat kayu melengkung organik
                ctx.strokeStyle = 'rgba(42, 20, 8, 0.22)';
                ctx.lineWidth = 1.4;
                for (let s = 0; s < 22; s++) {
                    const sy = py + (s / 22) * plankH;
                    ctx.beginPath();
                    for (let x = 0; x <= size; x += 16) {
                        const wave = Math.sin(x * 0.02 + p * 2.1 + s * 0.5) * 3.5;
                        if (x === 0) ctx.moveTo(x, sy + wave);
                        else ctx.lineTo(x, sy + wave);
                    }
                    ctx.stroke();
                }

                // Alur sambungan antar papan
                ctx.fillStyle = 'rgba(28, 12, 4, 0.55)';
                ctx.fillRect(0, py, size, 2.5);
                ctx.fillStyle = 'rgba(255, 210, 165, 0.14)';
                ctx.fillRect(0, py + 2.5, size, 1.5);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function getSandHeightAt(x, z) {
            if (!sandGeo) return POND.floorY;
            return POND.floorY + (Math.sin(x * 0.35) * 0.35 + Math.cos(z * 0.4) * 0.3 + Math.sin((x + z) * 0.2) * 0.25);
        }

        // =========================================================================
        // WADAH PAPAN KAYU ARTISTIK DI BAWAH KOLAM AKUARIUM
        // =========================================================================
        function buildArtisticWoodenTray() {
            const trayGroup = new THREE.Group();
            const woodTex = createArtisticWoodTexture();

            const mainWoodMat = new THREE.MeshStandardMaterial({
                map: woodTex,
                color: 0xd99b66,
                roughness: 0.46,
                metalness: 0.06
            });

            const darkTrimWoodMat = new THREE.MeshStandardMaterial({
                map: woodTex,
                color: 0x7a4422,
                roughness: 0.38,
                metalness: 0.1
            });

            const brassInlayMat = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                roughness: 0.28,
                metalness: 0.82
            });

            const baseW = POND.width + 2.4;
            const baseD = POND.depth + 2.4;
            const baseY = POND.floorY - 0.65;

            // 1. Alas Papan Kayu Utama Tebal dengan Bevel Artistik
            const trayShape = new THREE.Shape();
            const hw = baseW / 2;
            const hd = baseD / 2;
            const cornerR = 1.1;

            trayShape.moveTo(-hw + cornerR, -hd);
            trayShape.lineTo(hw - cornerR, -hd);
            trayShape.quadraticCurveTo(hw, -hd, hw, -hd + cornerR);
            trayShape.lineTo(hw, hd - cornerR);
            trayShape.quadraticCurveTo(hw, hd, hw - cornerR, hd);
            trayShape.lineTo(-hw + cornerR, hd);
            trayShape.quadraticCurveTo(-hw, hd, -hw, hd - cornerR);
            trayShape.lineTo(-hw, -hd + cornerR);
            trayShape.quadraticCurveTo(-hw, -hd, -hw + cornerR, -hd);

            const extrudeSettings = {
                depth: 0.65,
                bevelEnabled: true,
                bevelSegments: 4,
                steps: 1,
                bevelSize: 0.22,
                bevelThickness: 0.18
            };

            const baseGeo = new THREE.ExtrudeGeometry(trayShape, extrudeSettings);
            baseGeo.rotateX(Math.PI / 2);
            const baseMesh = new THREE.Mesh(baseGeo, mainWoodMat);
            baseMesh.position.y = baseY;
            trayGroup.add(baseMesh);

            // 2. Bingkai Bibir Wadah Kayu Mengelilingi Tepian Kolam (Tray Rim)
            const rimH = 0.68;
            const rimThick = 0.62;
            const rimY = POND.floorY - 0.22;

            // Sisi Depan & Belakang
            [-1, 1].forEach(sideZ => {
                const fbRim = new THREE.Mesh(new THREE.BoxGeometry(baseW + 0.1, rimH, rimThick), darkTrimWoodMat);
                fbRim.position.set(0, rimY, sideZ * (hd - rimThick / 2 + 0.08));
                trayGroup.add(fbRim);

                // Lis Inlay Kuningan Artistik pada Bibir Depan/Belakang
                const brassStrip = new THREE.Mesh(new THREE.BoxGeometry(baseW - 1.2, 0.07, 0.06), brassInlayMat);
                brassStrip.position.set(0, rimY + 0.12, sideZ * (hd + 0.09));
                trayGroup.add(brassStrip);
            });

            // Sisi Kiri & Kanan
            [-1, 1].forEach(sideX => {
                const lrRim = new THREE.Mesh(new THREE.BoxGeometry(rimThick, rimH, baseD - rimThick * 1.6), darkTrimWoodMat);
                lrRim.position.set(sideX * (hw - rimThick / 2 + 0.08), rimY, 0);
                trayGroup.add(lrRim);

                // Lis Inlay Kuningan Artistik pada Bibir Kiri/Kanan
                const brassStripSide = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, baseD - 1.4), brassInlayMat);
                brassStripSide.position.set(sideX * (hw + 0.09), rimY + 0.12, 0);
                trayGroup.add(brassStripSide);
            });

            // 3. Ornamen Sudut Kuningan Artistik (Corner Brackets)
            const cornerPositions = [
                [-hw + 0.12, -hd + 0.12],
                [hw - 0.12, -hd + 0.12],
                [-hw + 0.12, hd - 0.12],
                [hw - 0.12, hd - 0.12]
            ];
            cornerPositions.forEach(([cx, cz]) => {
                const cornerCap = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, rimH + 0.08, 16), brassInlayMat);
                cornerCap.position.set(cx, rimY, cz);
                trayGroup.add(cornerCap);
            });

            // 4. Kaki-kaki Penyangga Kayu Melengkung di Bawah Wadah
            const footPositions = [
                [-hw + 2.2, -hd + 1.8],
                [hw - 2.2, -hd + 1.8],
                [-hw + 2.2, hd - 1.8],
                [hw - 2.2, hd - 1.8]
            ];
            footPositions.forEach(([fx, fz]) => {
                const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.55, 0.55, 16), darkTrimWoodMat);
                foot.position.set(fx, baseY - 0.85, fz);
                trayGroup.add(foot);
            });

            scene.add(trayGroup);
        }

        // =========================================================================
        // MODEL 3D PESAWAT FLYING BOAT KAWANISHI H6K ("MAVIS") TENGGELAM
        // (BERDASARKAN GAMBAR PROFIL SAMPING IJN KEA-03 / 801-904)
        // =========================================================================
        function buildKawanishiH6KWreck() {
            const planeGroup = new THREE.Group();

            // Material Pesawat H6K IJN (IJN Dark Green Atas, Light Grey Bawah, Hinomaru Merah, Kanopi Kaca)
            const ijnGreenMat = new THREE.MeshStandardMaterial({ color: 0x1e4a2b, roughness: 0.72, metalness: 0.25 });
            const ijnDarkGreenMat = new THREE.MeshStandardMaterial({ color: 0x15361f, roughness: 0.78, metalness: 0.2 });
            const ijnGreyBottomMat = new THREE.MeshStandardMaterial({ color: 0x9aa6a8, roughness: 0.68, metalness: 0.3 });
            const hinomaruRedMat = new THREE.MeshStandardMaterial({ color: 0xc9221c, roughness: 0.55, metalness: 0.1 });
            const whiteStripeMat = new THREE.MeshStandardMaterial({ color: 0xeef2f3, roughness: 0.5 });
            const canopyGlassMat = new THREE.MeshPhysicalMaterial({
                color: 0x76c7d4, transparent: true, opacity: 0.65, roughness: 0.15, metalness: 0.2
            });
            const propMetalMat = new THREE.MeshStandardMaterial({ color: 0x3b281e, roughness: 0.45, metalness: 0.65 });
            const rustAlgaeMat = new THREE.MeshStandardMaterial({ color: 0x2d4d2c, roughness: 0.92 });

            // 1. Lambung Flying Boat (Boat Hull Fuselage dengan Planing Step di Bawah)
            // Bagian Utama Badan Pesawat
            const fuselageLen = 7.4;
            const fuselageGeo = new THREE.CylinderGeometry(0.46, 0.58, fuselageLen, 18);
            fuselageGeo.rotateZ(Math.PI / 2);
            const fuselageMesh = new THREE.Mesh(fuselageGeo, ijnGreenMat);
            fuselageMesh.scale.set(1.0, 1.18, 0.88);
            fuselageMesh.position.set(0, 0.85, 0);
            planeGroup.add(fuselageMesh);

            // Lunas Perahu Bawah (Flying Boat Hull Keel - Abu-abu IJN)
            const keelShape = new THREE.Shape();
            keelShape.moveTo(-3.6, 0.45);
            keelShape.quadraticCurveTo(-2.4, 0.02, -0.3, 0.0); // Langkah Hidrodinamis (Planing Step)
            keelShape.lineTo(-0.3, 0.14);
            keelShape.lineTo(3.4, 0.42);
            keelShape.lineTo(3.4, 0.68);
            keelShape.lineTo(-3.6, 0.68);
            keelShape.closePath();

            const keelExtrude = { depth: 0.72, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.12, bevelThickness: 0.12 };
            const keelGeo = new THREE.ExtrudeGeometry(keelShape, keelExtrude);
            keelGeo.translate(0, 0, -0.36);
            const keelMesh = new THREE.Mesh(keelGeo, ijnGreyBottomMat);
            planeGroup.add(keelMesh);

            // Hidung Pesawat & Kubah Kaca Penembak Depan (Nose Turret)
            const noseCone = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 14), ijnGreenMat);
            noseCone.scale.set(1.35, 1.05, 0.88);
            noseCone.position.set(-3.65, 0.82, 0);
            planeGroup.add(noseCone);

            const noseGlass = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), canopyGlassMat);
            noseGlass.position.set(-4.22, 0.82, 0);
            planeGroup.add(noseGlass);

            // Kokpit Kaca Bertingkat Khas H6K
            const cockpitGeo = new THREE.BoxGeometry(1.15, 0.34, 0.66);
            const cockpitMesh = new THREE.Mesh(cockpitGeo, canopyGlassMat);
            cockpitMesh.position.set(-2.35, 1.38, 0);
            cockpitMesh.rotation.z = 0.14;
            planeGroup.add(cockpitMesh);

            // Kubah Penembak Punggung (Dorsal Turret Blister) & Kubah Ekor
            const dorsalTurret = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2), canopyGlassMat);
            dorsalTurret.position.set(1.1, 1.42, 0);
            planeGroup.add(dorsalTurret);

            const tailTurret = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.42, 12), canopyGlassMat);
            tailTurret.rotation.z = Math.PI / 2;
            tailTurret.position.set(3.75, 0.92, 0);
            planeGroup.add(tailTurret);

            // Lambang Hinomaru (Lingkaran Merah Jepang) di Kedua Sisi Badan Pesawat
            [-1, 1].forEach(sideZ => {
                const hinomaruWhite = new THREE.Mesh(new THREE.CircleGeometry(0.46, 24), whiteStripeMat);
                hinomaruWhite.position.set(0.95, 0.86, sideZ * 0.52);
                if (sideZ < 0) hinomaruWhite.rotation.y = Math.PI;

                const hinomaruRed = new THREE.Mesh(new THREE.CircleGeometry(0.43, 24), hinomaruRedMat);
                hinomaruRed.position.set(0.95, 0.86, sideZ * 0.525);
                if (sideZ < 0) hinomaruRed.rotation.y = Math.PI;

                planeGroup.add(hinomaruWhite, hinomaruRed);
            });

            // 2. Sayap Parasol Lebar di Atas Badan Pesawat + Strut Penopang Khas H6K
            const wingSpan = 9.6;
            const wingGeo = new THREE.BoxGeometry(1.45, 0.14, wingSpan);
            const wingMesh = new THREE.Mesh(wingGeo, ijnGreenMat);
            wingMesh.position.set(-0.95, 1.88, 0);
            planeGroup.add(wingMesh);

            // Ujung Sayap Membulat (Wingtips) & Hinomaru Sayap
            [-1, 1].forEach(sideZ => {
                const wingTip = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.12, 16), ijnGreenMat);
                wingTip.scale.set(1.0, 1.0, 0.65);
                wingTip.position.set(-0.95, 1.88, sideZ * (wingSpan / 2));
                planeGroup.add(wingTip);

                const wingHinomaru = new THREE.Mesh(new THREE.CircleGeometry(0.48, 20), hinomaruRedMat);
                wingHinomaru.rotation.x = -Math.PI / 2;
                wingHinomaru.position.set(-0.95, 1.96, sideZ * 3.6);
                planeGroup.add(wingHinomaru);

                // Strut Penopang Parasol Wing ke Badan Pesawat
                const strut1 = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.85, 6), ijnGreyBottomMat);
                strut1.position.set(-1.15, 1.48, sideZ * 0.65);
                strut1.rotation.x = sideZ * 0.55;

                const strut2 = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.85, 6), ijnGreyBottomMat);
                strut2.position.set(-0.65, 1.48, sideZ * 0.65);
                strut2.rotation.x = sideZ * 0.55;

                planeGroup.add(strut1, strut2);

                // Pelampung Stabilizer Bawah Sayap (Outrigger Wing Floats)
                const floatBody = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 1.55, 12), ijnGreenMat);
                floatBody.rotation.z = Math.PI / 2;
                floatBody.scale.set(1.1, 1.0, 0.85);
                floatBody.position.set(-1.05, 0.82, sideZ * 3.25);

                const floatNose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 10), ijnGreenMat);
                floatNose.scale.set(1.6, 1.0, 0.85);
                floatNose.position.set(-1.82, 0.82, sideZ * 3.25);

                const floatStrutA = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.05, 6), ijnGreyBottomMat);
                floatStrutA.position.set(-1.25, 1.35, sideZ * 3.25);
                const floatStrutB = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.05, 6), ijnGreyBottomMat);
                floatStrutB.position.set(-0.75, 1.35, sideZ * 3.25);

                planeGroup.add(floatBody, floatNose, floatStrutA, floatStrutB);
            });

            // 3. Empat Mesin Bintang (4x Mitsubishi Kinsei Radial Engines + Baling-Baling 3 Bilah)
            const engineZOffsets = [-2.35, -1.05, 1.05, 2.35];
            engineZOffsets.forEach((zOff, idx) => {
                const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.22, 0.85, 14), ijnDarkGreenMat);
                nacelle.rotation.z = Math.PI / 2;
                nacelle.position.set(-1.62, 1.88, zOff);
                planeGroup.add(nacelle);

                // Baling-baling 3 Bilah (Sebagian bengkok karena karam)
                const propGroup = new THREE.Group();
                propGroup.position.set(-2.08, 1.88, zOff);
                const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 10), propMetalMat);
                spinner.rotation.z = Math.PI / 2;
                propGroup.add(spinner);

                for (let b = 0; b < 3; b++) {
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.42, 0.07), propMetalMat);
                    const angle = (b / 3) * Math.PI * 2 + idx * 0.5;
                    blade.position.set(0, Math.cos(angle) * 0.2, Math.sin(angle) * 0.2);
                    blade.rotation.x = angle;
                    // Efek baling-baling bengkok ringan akibat benturan dasar laut
                    if (idx === 1 && b === 2) blade.rotation.z = 0.42;
                    propGroup.add(blade);
                }
                planeGroup.add(propGroup);
            });

            // 4. Ekor Tegak Tinggi & Stabilizer Horizontal dengan Garis Merah-Putih (KEA-03)
            const tailFinShape = new THREE.Shape();
            tailFinShape.moveTo(2.4, 1.15);
            tailFinShape.lineTo(3.55, 1.15);
            tailFinShape.lineTo(3.38, 2.55);
            tailFinShape.quadraticCurveTo(3.15, 2.75, 2.95, 2.55);
            tailFinShape.closePath();

            const tailFinGeo = new THREE.ExtrudeGeometry(tailFinShape, { depth: 0.08, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 });
            tailFinGeo.translate(0, 0, -0.04);
            const tailFinMesh = new THREE.Mesh(tailFinGeo, ijnGreenMat);
            planeGroup.add(tailFinMesh);

            // Garis Diagonal Merah-Putih Khas Skuadron 901 (KEA-03) di Ekor
            const stripeWhite = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.14, 0.14), whiteStripeMat);
            stripeWhite.position.set(3.12, 2.02, 0);
            stripeWhite.rotation.z = -0.78;
            const stripeRed = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.08, 0.15), hinomaruRedMat);
            stripeRed.position.set(3.12, 2.02, 0);
            stripeRed.rotation.z = -0.78;
            planeGroup.add(stripeWhite, stripeRed);

            // Stabilizer Horizontal Ekor
            const hStab = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.08, 3.1), ijnGreenMat);
            hStab.position.set(3.15, 1.32, 0);
            planeGroup.add(hStab);

            // Lumut Laut Alami pada Badan Pesawat Karam
            const mossPatch = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45, 1), rustAlgaeMat);
            mossPatch.scale.set(1.6, 0.35, 0.9);
            mossPatch.position.set(-1.4, 0.55, 0.42);
            planeGroup.add(mossPatch);

            // Penempatan Pesawat H6K di Dasar Pasir Tropis (miring karam alami)
            const posX = -4.6;
            const posZ = 1.5;
            const posY = getSandHeightAt(posX, posZ) - 0.1;

            planeGroup.position.set(posX, posY, posZ);
            planeGroup.rotation.set(0.18, 0.52, -0.14);
            scene.add(planeGroup);
        }

                pos.setY(i, wave);

        /**
         * Membuat sedikit kerang tropis (Scallop Shell & Spiral Conch Shell) tersebar alami di pasir
         */
        function buildTropicalSeashells() {
            const shellColors = [0xfff5e4, 0xfad4c0, 0xf7b2ad, 0xffe5b4, 0xe8d5c4];

            // 1. Kerang Kipas Tropis (Scallop Shells - 9 buah)
            for (let i = 0; i < 9; i++) {
                let sx, sz, attempts = 0;
                do {
                    sx = (Math.random() - 0.5) * (POND.width - 3.5);
                    sz = (Math.random() - 0.5) * (POND.depth - 3.5);
                    attempts++;
                } while (isInsideProtectedZone(sx, sz, 0.3) && attempts < 30);

                if (attempts >= 30) continue;

                const shellGroup = new THREE.Group();
                const col = shellColors[i % shellColors.length];
                const shellMat = new THREE.MeshPhysicalMaterial({
                    color: col,
                    roughness: 0.28,
                    clearcoat: 0.65,
                    side: THREE.DoubleSide
                });

                // Geometri Cangkang Kipas Bergelombang
                const radius = 0.24 + Math.random() * 0.14;
                const scallopGeo = new THREE.CircleGeometry(radius, 18, 0, Math.PI * 1.15);
                scallopGeo.rotateX(-Math.PI / 2);

                const pos = scallopGeo.attributes.position;
                for (let v = 0; v < pos.count; v++) {
                    const vx = pos.getX(v);
                    const vz = pos.getZ(v);
                    const dist = Math.hypot(vx, vz);
                    const ang = Math.atan2(vz, vx);
                    // Lengkungan cangkang + alur rusuk kipas
                    const dome = Math.sin((dist / radius) * Math.PI) * 0.08;
                    const ridges = Math.sin(ang * 14) * 0.015 * (dist / radius);
                    pos.setY(v, dome + ridges);
                }
                scallopGeo.computeVertexNormals();

                const scallopMesh = new THREE.Mesh(scallopGeo, shellMat);
                shellGroup.add(scallopMesh);

                // Engsel kecil pangkal kerang
                const hinge = new THREE.Mesh(new THREE.BoxGeometry(radius * 0.5, 0.04, 0.06), shellMat);
                shellGroup.add(hinge);

                shellGroup.position.set(sx, getSandHeightAt(sx, sz) + 0.04, sz);
                shellGroup.rotation.set(
                    (Math.random() - 0.5) * 0.25,
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * 0.25
                );
                scene.add(shellGroup);
            }

            // 2. Kerang Keong Spiral Tropis (Spiral Conch Shells - 6 buah)
            for (let j = 0; j < 6; j++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 3.5);
                    cz = (Math.random() - 0.5) * (POND.depth - 3.5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 0.3) && attempts < 30);

                if (attempts >= 30) continue;

                const conchGroup = new THREE.Group();
                const col = shellColors[(j + 2) % shellColors.length];
                const conchMat = new THREE.MeshPhysicalMaterial({
                    color: col,
                    roughness: 0.26,
                    clearcoat: 0.7
                });

                // 4 Ruas Spiral Mengerucut
                const scale = 0.85 + Math.random() * 0.35;
                for (let seg = 0; seg < 4; seg++) {
                    const segR = (0.14 - seg * 0.026) * scale;
                    const segGeo = new THREE.SphereGeometry(segR, 12, 10);
                    segGeo.scale(1.2, 0.9, 1.0);
                    const segMesh = new THREE.Mesh(segGeo, conchMat);
                    segMesh.position.set(seg * 0.11 * scale, segR * 0.75, 0);
                    conchGroup.add(segMesh);
                }

                conchGroup.position.set(cx, getSandHeightAt(cx, cz) + 0.03, cz);
                conchGroup.rotation.set(
                    (Math.random() - 0.5) * 0.2,
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * 0.2
                );
                scene.add(conchGroup);
            }
        }

        function buildAbstractColorfulCorals() {
            const aeroCoralPalette = [
                0xff2e93, 0x00d4f5, 0x64dd17, 0xff6d00, 
                0xa67cff, 0xf5d000, 0xff4081, 0x1de9b6
            ];

            const pickColor = (offset = 0) => aeroCoralPalette[(Math.floor(Math.random() * aeroCoralPalette.length) + offset) % aeroCoralPalette.length];

            const rockMat = new THREE.MeshStandardMaterial({ color: 0x5c7c8a, roughness: 0.78 });
            for (let i = 0; i < 11; i++) {
                let rx, rz, attempts = 0;
                do {
                    rx = (Math.random() - 0.5) * (POND.width - 4);
                    rz = (Math.random() - 0.5) * (POND.depth - 4);
                    attempts++;
                } while (isInsideProtectedZone(rx, rz, 1.2) && attempts < 40);

                if (attempts >= 40) continue;

                const rockGeo = new THREE.DodecahedronGeometry(0.75 + Math.random() * 1.15, 1);
                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.scale.set(1.35, 0.68, 1.15);
                rock.position.set(rx, getSandHeightAt(rx, rz) + 0.15, rz);
                rock.rotation.y = Math.random() * Math.PI;
                scene.add(rock);
            }

            for (let b = 0; b < 6; b++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 5);
                    cz = (Math.random() - 0.5) * (POND.depth - 5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 1.5) && attempts < 40);

                if (attempts >= 40) continue;

                const radius = 0.85 + Math.random() * 0.6;
                const brainGeo = new THREE.IcosahedronGeometry(radius, 3);
                const pos = brainGeo.attributes.position;

                for (let v = 0; v < pos.count; v++) {
                    const vx = pos.getX(v);
                    const vy = pos.getY(v);
                    const vz = pos.getZ(v);
                    const ridge = Math.sin(vx * 7.5 + b) * Math.cos(vy * 7.5) * Math.sin(vz * 7.5) * 0.16;
                    const len = Math.hypot(vx, vy, vz) || 1;
                    pos.setXYZ(
                        v,
                        vx + (vx / len) * ridge,
                        Math.max(-radius * 0.35, vy + (vy / len) * ridge),
                        vz + (vz / len) * ridge
                    );
                }
                brainGeo.computeVertexNormals();

                const col = pickColor(b);
                const brainMat = new THREE.MeshPhysicalMaterial({
                    color: col,
                    emissive: col,
                    emissiveIntensity: 0.08,
                    roughness: 0.36,
                    clearcoat: 0.45
                });
                const brainMesh = new THREE.Mesh(brainGeo, brainMat);
                brainMesh.position.set(cx, getSandHeightAt(cx, cz) + radius * 0.32, cz);
                scene.add(brainMesh);
            }

            for (let s = 0; s < 9; s++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 5);
                    cz = (Math.random() - 0.5) * (POND.depth - 5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 1.5) && attempts < 40);

                if (attempts >= 40) continue;

                const group = new THREE.Group();
                const baseCol = pickColor(s * 2);

                const armCount = 4 + Math.floor(Math.random() * 4);
                for (let a = 0; a < armCount; a++) {
                    const points = [];
                    const angleOffset = (a / armCount) * Math.PI * 2;
                    const height = 1.6 + Math.random() * 1.8;
                    const spiralTwist = (Math.random() - 0.5) * 1.6;

                    for (let step = 0; step <= 6; step++) {
                        const t = step / 6;
                        const spread = Math.sin(t * Math.PI * 0.75) * (0.7 + a * 0.12);
                        const px = Math.cos(angleOffset + t * spiralTwist) * spread;
                        const pz = Math.sin(angleOffset + t * spiralTwist) * spread;
                        const py = t * height;
                        points.push(new THREE.Vector3(px, py, pz));
                    }

                    const curve = new THREE.CatmullRomCurve3(points);
                    const tubeGeo = new THREE.TubeGeometry(curve, 14, 0.13 - a * 0.008, 8, false);
                    const armCol = a % 2 === 0 ? baseCol : pickColor(s + a);
                    const armMat = new THREE.MeshPhysicalMaterial({
                        color: armCol,
                        emissive: armCol,
                        emissiveIntensity: 0.08,
                        roughness: 0.32,
                        clearcoat: 0.5
                    });
                    const armMesh = new THREE.Mesh(tubeGeo, armMat);
                    group.add(armMesh);

                    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), armMat);
                    tip.position.copy(points[points.length - 1]);
                    group.add(tip);
                }

                group.position.set(cx, getSandHeightAt(cx, cz) - 0.08, cz);
                scene.add(group);
            }

            for (let p = 0; p < 6; p++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 5);
                    cz = (Math.random() - 0.5) * (POND.depth - 5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 1.5) && attempts < 40);

                if (attempts >= 40) continue;

                const group = new THREE.Group();
                const tiers = 3 + Math.floor(Math.random() * 3);

                for (let t = 0; t < tiers; t++) {
                    const plateR = 0.65 + Math.random() * 0.7;
                    const plateGeo = new THREE.CylinderGeometry(plateR, plateR * 0.35, 0.22, 18);
                    const pPos = plateGeo.attributes.position;
                    for (let v = 0; v < pPos.count; v++) {
                        const vx = pPos.getX(v);
                        const vz = pPos.getZ(v);
                        const ang = Math.atan2(vz, vx);
                        pPos.setY(v, pPos.getY(v) + Math.sin(ang * 6 + t) * 0.06);
                    }
                    plateGeo.computeVertexNormals();

                    const col = pickColor(p + t);
                    const plateMat = new THREE.MeshPhysicalMaterial({
                        color: col,
                        emissive: col,
                        emissiveIntensity: 0.07,
                        roughness: 0.35,
                        clearcoat: 0.45
                    });

                    const plate = new THREE.Mesh(plateGeo, plateMat);
                    plate.position.set(
                        (Math.random() - 0.5) * 0.9,
                        0.45 + t * 0.48,
                        (Math.random() - 0.5) * 0.9
                    );
                    plate.rotation.set((Math.random() - 0.5) * 0.25, Math.random() * Math.PI, (Math.random() - 0.5) * 0.25);
                    group.add(plate);
                }

                group.position.set(cx, getSandHeightAt(cx, cz) - 0.05, cz);
                scene.add(group);
            }

            for (let f = 0; f < 6; f++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 5);
                    cz = (Math.random() - 0.5) * (POND.depth - 5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 1.5) && attempts < 40);

                if (attempts >= 40) continue;

                const group = new THREE.Group();
                const fanCol = pickColor(f * 3);
                const fanMat = new THREE.MeshStandardMaterial({
                    color: fanCol,
                    emissive: fanCol,
                    emissiveIntensity: 0.1,
                    roughness: 0.4
                });

                const ribs = 7;
                for (let r = 0; r < ribs; r++) {
                    const spreadAngle = ((r / (ribs - 1)) - 0.5) * 1.45;
                    const ribLen = 1.6 + Math.cos(spreadAngle) * 1.1;
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(Math.sin(spreadAngle) * ribLen * 0.55, ribLen * 0.55, Math.sin(r) * 0.12),
                        new THREE.Vector3(Math.sin(spreadAngle) * ribLen, ribLen, 0)
                    ]);
                    const ribMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.055, 6, false), fanMat);
                    group.add(ribMesh);
                }

                group.position.set(cx, getSandHeightAt(cx, cz) - 0.05, cz);
                group.rotation.y = Math.random() * Math.PI;
                scene.add(group);
            }

            for (let a = 0; a < 7; a++) {
                let cx, cz, attempts = 0;
                do {
                    cx = (Math.random() - 0.5) * (POND.width - 5);
                    cz = (Math.random() - 0.5) * (POND.depth - 5);
                    attempts++;
                } while (isInsideProtectedZone(cx, cz, 1.5) && attempts < 40);

                if (attempts >= 40) continue;

                const group = new THREE.Group();
                const bodyCol = pickColor(a);
                const tipCol = pickColor(a + 3);

                const baseMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.45, 0.55, 0.45, 14),
                    new THREE.MeshStandardMaterial({ color: bodyCol, roughness: 0.45 })
                );
                baseMesh.position.y = 0.22;
                group.add(baseMesh);

                const tentacles = [];
                const tentacleMat = new THREE.MeshPhysicalMaterial({
                    color: tipCol,
                    emissive: tipCol,
                    emissiveIntensity: 0.12,
                    roughness: 0.3,
                    clearcoat: 0.7
                });

                const tCount = 16;
                for (let t = 0; t < tCount; t++) {
                    const ring = t < 10 ? 0.34 : 0.18;
                    const ang = (t / (t < 10 ? 10 : 6)) * Math.PI * 2;
                    const th = 0.85 + Math.random() * 0.45;
                    const tGeo = new THREE.CylinderGeometry(0.04, 0.08, th, 6);
                    tGeo.translate(0, th / 2, 0);

                    const tentacle = new THREE.Mesh(tGeo, tentacleMat);
                    tentacle.position.set(Math.cos(ang) * ring, 0.38, Math.sin(ang) * ring);
                    const baseTiltX = Math.sin(ang) * 0.35;
                    const baseTiltZ = -Math.cos(ang) * 0.35;
                    tentacle.rotation.set(baseTiltX, 0, baseTiltZ);

                    group.add(tentacle);
                    tentacles.push({ mesh: tentacle, baseTiltX, baseTiltZ, phase: t * 0.6 + a });
                }

                group.position.set(cx, getSandHeightAt(cx, cz) - 0.05, cz);
                scene.add(group);
                animatedAnemones.push(tentacles);
            }
        }

        function buildSeaweedForest() {
            const weedColors = [0x1bc958, 0x00ba6c, 0x42db66, 0x009e88];

            for (let cluster = 0; cluster < 32; cluster++) {
                let baseX, baseZ, attempts = 0;
                do {
                    baseX = (Math.random() - 0.5) * (POND.width - 2.5);
                    baseZ = (Math.random() - 0.5) * (POND.depth - 2.5);
                    attempts++;
                } while (isInsideProtectedZone(baseX, baseZ, 1.2) && attempts < 40);

                if (attempts >= 40) continue;

                const isTallKelp = cluster % 3 === 0;
                const blades = isTallKelp ? (3 + Math.floor(Math.random() * 3)) : (2 + Math.floor(Math.random() * 3));

                const mat = new THREE.MeshStandardMaterial({
                    color: weedColors[cluster % weedColors.length],
                    emissive: 0x064f20,
                    emissiveIntensity: 0.12,
                    roughness: 0.42,
                    side: THREE.DoubleSide
                });

                for (let b = 0; b < blades; b++) {
                    const bladeH = isTallKelp ? (5.2 + Math.random() * 4.5) : (2.2 + Math.random() * 2.5);
                    const bladeW = isTallKelp ? 0.32 : 0.22;
                    const bladeGeo = new THREE.PlaneGeometry(bladeW, bladeH, 2, 14);
                    bladeGeo.translate(0, bladeH / 2, 0);

                    const pos = bladeGeo.attributes.position;
                    for (let v = 0; v < pos.count; v++) {
                        const oy = pos.getY(v);
                        const ratio = oy / bladeH;
                        const taper = Math.sin(Math.min(1, ratio) * Math.PI * 0.85 + 0.25);
                        pos.setX(v, pos.getX(v) * taper);
                    }
                    bladeGeo.computeVertexNormals();

                    const bx = baseX + (Math.random() - 0.5) * 0.7;
                    const bz = baseZ + (Math.random() - 0.5) * 0.7;
                    const blade = new THREE.Mesh(bladeGeo, mat);
                    blade.position.set(bx, getSandHeightAt(bx, bz) - 0.08, bz);
                    blade.rotation.y = Math.random() * Math.PI;
                    scene.add(blade);

                    swayingFlora.push({
                        mesh: blade,
                        geo: bladeGeo,
                        origPositions: Float32Array.from(bladeGeo.attributes.position.array),
                        height: bladeH,
                        speed: 1.5 + Math.random() * 1.1,

        class MiniCrab3D {
            constructor(x, z, colorHex) {
                this.group = new THREE.Group();
                const shellMat = new THREE.MeshPhysicalMaterial({
                    color: colorHex,
                    roughness: 0.32,
                    clearcoat: 0.6
                });
                const clawMat = new THREE.MeshPhysicalMaterial({
                    color: 0xff9e40,
                    roughness: 0.3,
                    clearcoat: 0.7
                });

                const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 10), shellMat);
                body.scale.set(1.25, 0.55, 0.95);
                body.position.y = 0.22;
                this.group.add(body);

                [-0.12, 0.12].forEach(ex => {
                    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.14, 6), shellMat);
                    stalk.position.set(ex, 0.38, 0.22);
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshBasicMaterial({ color: 0x111827 }));
                    eye.position.set(ex, 0.45, 0.23);
                    this.group.add(stalk, eye);
                });

                this.claws = [];
                [-1, 1].forEach(side => {
                    const clawPivot = new THREE.Group();
                    clawPivot.position.set(side * 0.36, 0.22, 0.24);
                    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.12), clawMat);
                    arm.position.set(side * 0.08, 0, 0.06);
                    const pincer = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), clawMat);
                    pincer.scale.set(1.2, 0.65, 0.9);
                    pincer.position.set(side * 0.18, 0.02, 0.14);
                    clawPivot.add(arm, pincer);
                    this.group.add(clawPivot);
                    this.claws.push(clawPivot);
                });

                this.legs = [];
                for (let side of [-1, 1]) {
                    for (let i = 0; i < 3; i++) {
                        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.015, 0.28, 6), shellMat);
                        leg.position.set(side * 0.36, 0.14, -0.14 + i * 0.13);
                        leg.rotation.z = side * 0.85;
                        this.group.add(leg);
                        this.legs.push({ mesh: leg, side, index: i });
                    }
                }

                this.group.position.set(x, getSandHeightAt(x, z), z);
                scene.add(this.group);

                this.moveDir = Math.random() > 0.5 ? 1 : -1;
                this.speed = 0.014 + Math.random() * 0.01;
                this.phase = Math.random() * Math.PI * 2;
                this.pauseTimer = 0;
            }

            update(elapsed) {
                if (this.pauseTimer > 0) {
                    this.pauseTimer -= 0.016;
                    this.claws[0].rotation.y = Math.sin(elapsed * 4 + this.phase) * 0.2;
                    this.claws[1].rotation.y = -Math.sin(elapsed * 4 + this.phase) * 0.2;
                    return;
                }

                if (Math.random() < 0.008) {
                    this.pauseTimer = 1.0 + Math.random() * 1.8;
                    if (Math.random() < 0.5) this.moveDir *= -1;
                    return;
                }

                const forwardRight = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.group.rotation.y);
                this.group.position.addScaledVector(forwardRight, this.moveDir * this.speed);

                const limitX = POND.width * 0.42;
                const limitZ = POND.depth * 0.4;
                if (Math.abs(this.group.position.x) > limitX || Math.abs(this.group.position.z) > limitZ) {
                    this.moveDir *= -1;
                    this.group.position.x = Math.max(-limitX, Math.min(limitX, this.group.position.x));
                    this.group.position.z = Math.max(-limitZ, Math.min(limitZ, this.group.position.z));
                }

                this.group.position.y = getSandHeightAt(this.group.position.x, this.group.position.z);

                const stepCycle = elapsed * 14 + this.phase;
                for (let i = 0; i < this.legs.length; i++) {
                    const l = this.legs[i];
                    const offset = (l.index % 2 === 0 ? 0 : Math.PI) + (l.side > 0 ? 0 : Math.PI * 0.5);
                    l.mesh.rotation.z = l.side * (0.85 + Math.sin(stepCycle + offset) * 0.28);
                    l.mesh.rotation.y = Math.cos(stepCycle + offset) * 0.22;
                }
            }
        }

                });

                this.antennae = [];
                [-1, 1].forEach(side => {
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(side * 0.1, 0.34, 0.58),
                        new THREE.Vector3(side * 0.32, 0.55, 1.05),
                        new THREE.Vector3(side * 0.55, 0.72, 1.55)
                    ]);
                    const ant = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.015, 5, false), accentMat);
                    this.group.add(ant);
                    this.antennae.push(ant);
                });

                this.legs = [];
                for (let side of [-1, 1]) {
                    for (let i = 0; i < 4; i++) {
                        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.018, 0.36, 6), accentMat);
                        leg.position.set(side * 0.32, 0.15, -0.15 + i * 0.16);
                        leg.rotation.z = side * 0.75;
                        this.group.add(leg);
                        this.legs.push({ mesh: leg, side, index: i });

                }

                this.group.position.set(x, getSandHeightAt(x, z), z);
                this.group.rotation.y = Math.random() * Math.PI * 2;
                scene.add(this.group);

                this.targetYaw = this.group.rotation.y;
                this.speed = 0.012;
                this.phase = Math.random() * Math.PI * 2;
            }

            update(elapsed) {
                if (Math.random() < 0.012) {
                    this.targetYaw += (Math.random() - 0.5) * 1.4;
                }

                let diff = this.targetYaw - this.group.rotation.y;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                this.group.rotation.y += diff * 0.04;

                const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.group.rotation.y);
                this.group.position.addScaledVector(forward, this.speed);

                const limitX = POND.width * 0.4;
                const limitZ = POND.depth * 0.38;
                if (Math.abs(this.group.position.x) > limitX || Math.abs(this.group.position.z) > limitZ) {
                    this.targetYaw += Math.PI * 0.75;
                    this.group.position.x = Math.max(-limitX, Math.min(limitX, this.group.position.x));
                    this.group.position.z = Math.max(-limitZ, Math.min(limitZ, this.group.position.z));
                }

                this.group.position.y = getSandHeightAt(this.group.position.x, this.group.position.z);

                this.antennae[0].rotation.y = Math.sin(elapsed * 3.2 + this.phase) * 0.14;
                this.antennae[1].rotation.y = -Math.sin(elapsed * 3.2 + this.phase) * 0.14;
                this.tailGroup.rotation.x = Math.sin(elapsed * 2.5 + this.phase) * 0.08;
                this.claws[0].rotation.y = Math.sin(elapsed * 2.0 + this.phase) * 0.12;
                this.claws[1].rotation.y = -Math.sin(elapsed * 2.0 + this.phase) * 0.12;

                const walkCycle = elapsed * 10 + this.phase;
                for (let i = 0; i < this.legs.length; i++) {
                    const l = this.legs[i];
                    const offset = l.index * 1.1 + (l.side > 0 ? 0 : Math.PI);
                    l.mesh.rotation.x = Math.sin(walkCycle + offset) * 0.25;
                }
            }
        }

        function buildSeabedCritters() {
