        class SwimmingFish3D {
            constructor(spriteCanvas, x, y, z) {
                const texture = new THREE.CanvasTexture(spriteCanvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;

                const aspect = spriteCanvas.width / spriteCanvas.height;
                const fishHeight = 2.3;
                const fishWidth = fishHeight * aspect;

                this.geometry = new THREE.PlaneGeometry(fishWidth, fishHeight, 16, 2);
                this.origPositions = Float32Array.from(this.geometry.attributes.position.array);
                this.fishWidth = fishWidth;

                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    transparent: true,
                    alphaTest: 0.08,
                    side: THREE.DoubleSide,
                    roughness: 0.42,
                    metalness: 0.04
                });

                this.mesh = new THREE.Mesh(this.geometry, material);
                this.mesh.position.set(x, y, z);
                scene.add(this.mesh);

                const dirX = Math.random() > 0.5 ? 1 : -1;
                this.velocity = new THREE.Vector3(
                    dirX * (0.045 + Math.random() * 0.04),
                    (Math.random() - 0.5) * 0.015,
                    (Math.random() - 0.5) * 0.035
                );
                this.targetVelocity = this.velocity.clone();

                this.swimPhase = Math.random() * Math.PI * 2;
                this.swimSpeed = 0.16 + Math.random() * 0.06;
                this.sizeBoost = 1.0;
                this.currentYaw = dirX > 0 ? 0 : Math.PI;
            }

            update(dt, elapsedTime) {
                this.swimPhase += this.swimSpeed;

                let nearestFood = null;
                let minDist = 11.0;

                for (let i = 0; i < foods3D.length; i++) {
                    const f = foods3D[i];
                    const dist = this.mesh.position.distanceTo(f.mesh.position);
                    if (dist < minDist) {
                        minDist = dist;
                        nearestFood = f;
                    }
                }

                if (nearestFood) {
                    const dir = new THREE.Vector3().subVectors(nearestFood.mesh.position, this.mesh.position).normalize();
                    const chaseSpeed = 0.095;
                    this.velocity.lerp(dir.multiplyScalar(chaseSpeed), 0.07);
                    this.swimPhase += 0.12;

                    if (minDist < 1.15) {
                        scene.remove(nearestFood.mesh);
                        foods3D.splice(foods3D.indexOf(nearestFood), 1);
                        sound.playNibble();
                        this.sizeBoost = Math.min(1.32, this.sizeBoost + 0.03);
                        this.mesh.scale.setScalar(this.sizeBoost);

                        for (let b = 0; b < 4; b++) {
                            spawnBubble3D(
                                this.mesh.position.x + (Math.random() - 0.5) * 0.6,
                                this.mesh.position.y + 0.3,
                                this.mesh.position.z + (Math.random() - 0.5) * 0.6
                            );
                        }
                    }
                } else {
                    if (Math.random() < 0.018) {
                        const speed = 0.045 + Math.random() * 0.035;
                        const angleXZ = Math.random() * Math.PI * 2;
                        this.targetVelocity.set(
                            Math.cos(angleXZ) * speed,
                            (Math.random() - 0.5) * 0.025,
                            Math.sin(angleXZ) * speed
                        );
                    }
                    this.velocity.lerp(this.targetVelocity, 0.03);
                }

                this.mesh.position.add(this.velocity);
                this.mesh.position.y += Math.sin(elapsedTime * 2.2 + this.swimPhase * 0.3) * 0.004;

                const boundX = POND.width * 0.44;
                const boundZ = POND.depth * 0.42;
                const minY = POND.floorY + 1.8;
                const maxY = POND.surfaceY - 1.4;

                if (this.mesh.position.x > boundX) {
                    this.mesh.position.x = boundX;
                    this.velocity.x = -Math.abs(this.velocity.x);
                    this.targetVelocity.x = -Math.abs(this.targetVelocity.x);
                } else if (this.mesh.position.x < -boundX) {
                    this.mesh.position.x = -boundX;
                    this.velocity.x = Math.abs(this.velocity.x);
                    this.targetVelocity.x = Math.abs(this.targetVelocity.x);
                }

                if (this.mesh.position.z > boundZ) {
                    this.mesh.position.z = boundZ;
                    this.velocity.z = -Math.abs(this.velocity.z);
                    this.targetVelocity.z = -Math.abs(this.targetVelocity.z);
                } else if (this.mesh.position.z < -boundZ) {
                    this.mesh.position.z = -boundZ;
                    this.velocity.z = Math.abs(this.velocity.z);
                    this.targetVelocity.z = Math.abs(this.targetVelocity.z);
                }

                if (this.mesh.position.y < minY) {
                    this.mesh.position.y = minY;
                    this.velocity.y = Math.abs(this.velocity.y) * 0.5;
                    this.targetVelocity.y = 0.015;
                } else if (this.mesh.position.y > maxY) {
                    this.mesh.position.y = maxY;
                    this.velocity.y = -Math.abs(this.velocity.y) * 0.5;
                    this.targetVelocity.y = -0.015;
                }

                const horizSpeed = Math.hypot(this.velocity.x, this.velocity.z);
                if (horizSpeed > 0.004) {
                    const desiredYaw = Math.atan2(-this.velocity.z, this.velocity.x);
                    let diff = desiredYaw - this.currentYaw;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    this.currentYaw += diff * 0.1;
                }
                this.mesh.rotation.y = this.currentYaw;

                const pitch = Math.max(-0.35, Math.min(0.35, this.velocity.y * 4.5));
                this.mesh.rotation.z = pitch;

                const posAttr = this.geometry.attributes.position;
                const halfW = this.fishWidth / 2;

                for (let i = 0; i < posAttr.count; i++) {
                    const ox = this.origPositions[i * 3];
                    const progress = (ox + halfW) / this.fishWidth;
                    const flexibility = Math.pow(1 - progress, 1.65);
                    const waveZ = Math.sin(this.swimPhase - progress * 3.5) * (0.34 * flexibility);
                    posAttr.setZ(i, waveZ);
                }
                posAttr.needsUpdate = true;

                if (Math.random() < 0.005) {
                    spawnBubble3D(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, 0.08);
                }
            }

            dispose() {
                scene.remove(this.mesh);
                this.geometry.dispose();
                if (this.mesh.material.map) this.mesh.material.map.dispose();
                this.mesh.material.dispose();
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            const sPos = surfaceGeo.attributes.position;
            for (let i = 0; i < sPos.count; i++) {
                const ox = surfaceOrigPositions[i * 3];
                const oz = surfaceOrigPositions[i * 3 + 2];
                const waveY =
                    Math.sin(ox * 0.45 + elapsed * 2.1) * 0.16 +
                    Math.cos(oz * 0.5 + elapsed * 1.7) * 0.14 +
                    Math.sin((ox + oz) * 0.35 + elapsed * 2.6) * 0.08;
                sPos.setY(i, surfaceOrigPositions[i * 3 + 1] + waveY);
            }
            sPos.needsUpdate = true;
            surfaceGeo.computeVertexNormals();

            if (causticTexture) {
                causticTexture.offset.x = Math.sin(elapsed * 0.25) * 0.3;
                causticTexture.offset.y = elapsed * 0.06;
            }

            for (let i = 0; i < sunBeams.length; i++) {
                const sb = sunBeams[i];
                sb.mesh.rotation.z = sb.baseRotZ + Math.sin(elapsed * 0.55 + sb.phase) * 0.07;
            }

            if (bgBubblesGroup) {
                bgBubblesGroup.rotation.y = elapsed * 0.025;
                bgBubblesGroup.children.forEach(orb => {
                    orb.position.y = orb.userData.baseY + Math.sin(elapsed * orb.userData.speed + orb.userData.phase) * 1.2;
                });
            }

            if (planktonPoints && planktonOrigPositions) {
                const pPos = planktonPoints.geometry.attributes.position;
                for (let i = 0; i < pPos.count; i++) {
                    const ox = planktonOrigPositions[i * 3];
                    const oy = planktonOrigPositions[i * 3 + 1];
                    const oz = planktonOrigPositions[i * 3 + 2];
                    pPos.setX(i, ox + Math.sin(elapsed * 0.7 + oy * 0.5 + i) * 0.45);
                    pPos.setY(i, oy + Math.cos(elapsed * 0.6 + ox * 0.4 + i) * 0.25);
                    pPos.setZ(i, oz + Math.sin(elapsed * 0.65 + oz * 0.5 + i) * 0.45);
                }
                pPos.needsUpdate = true;
            }

            for (let i = 0; i < swayingFlora.length; i++) {
                const f = swayingFlora[i];
                const pos = f.geo.attributes.position;
                for (let v = 0; v < pos.count; v++) {
                    const oy = f.origPositions[v * 3 + 1];
                    const ratio = Math.max(0, oy / f.height);
                    const swayX = Math.sin(elapsed * f.speed + f.phase + ratio * 2.4) * (f.amplitude * ratio);
                    const swayZ = Math.cos(elapsed * (f.speed * 0.8) + f.phase + ratio * 2.0) * (f.amplitude * 0.5 * ratio);
                    pos.setX(v, f.origPositions[v * 3] + swayX);
                    pos.setZ(v, f.origPositions[v * 3 + 2] + swayZ);
                }
                pos.needsUpdate = true;
            }

            for (let a = 0; a < animatedAnemones.length; a++) {
                const group = animatedAnemones[a];
                for (let t = 0; t < group.length; t++) {
                    const item = group[t];
                    item.mesh.rotation.x = item.baseTiltX + Math.sin(elapsed * 2.4 + item.phase) * 0.16;
                    item.mesh.rotation.z = item.baseTiltZ + Math.cos(elapsed * 2.1 + item.phase) * 0.16;
                }
            }

            for (let c = 0; c < miniCrabs.length; c++) {
                miniCrabs[c].update(elapsed);
            }
            for (let l = 0; l < lobsters.length; l++) {
                lobsters[l].update(elapsed);
            }

            for (let i = 0; i < fishes3D.length; i++) {
                fishes3D[i].update(dt, elapsed);
            }

            if (followedFishIndex >= 0 && fishes3D[followedFishIndex]) {
                const targetPos = fishes3D[followedFishIndex].mesh.position;
                const deltaMove = new THREE.Vector3().subVectors(targetPos, prevFollowPos);
                camera.position.add(deltaMove);
                controls.target.lerp(targetPos, 0.15);
                prevFollowPos.copy(targetPos);
            } else if (followedFishIndex >= 0) {
                setFollowedFish(-1);
            }

            for (let i = foods3D.length - 1; i >= 0; i--) {
                const f = foods3D[i];
                f.wobble += 0.08;
                f.mesh.position.y -= f.vy;
                f.mesh.position.x += Math.sin(f.wobble) * 0.012;

                if (f.mesh.position.y <= POND.floorY + 0.2) {
                    scene.remove(f.mesh);
                    foods3D.splice(i, 1);
                }
            }

            if (bubbles3D.length < 55 && Math.random() < 0.12) {
                spawnBubble3D();
            }

            for (let i = bubbles3D.length - 1; i >= 0; i--) {
                const b = bubbles3D[i];
                b.wobble += 0.05;
                b.mesh.position.y += b.speed;
                b.mesh.position.x += Math.sin(b.wobble) * 0.015;

                if (b.mesh.position.y >= POND.surfaceY) {
                    scene.remove(b.mesh);
                    bubbles3D.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const drawingModal = document.getElementById('drawingModal');
        const fishCountEl = document.getElementById('fishCount');

        function updateFishCounter() {
            fishCountEl.textContent = fishes3D.length;
        }

        document.getElementById('openDrawModalBtn').addEventListener('click', () => {
            drawingModal.classList.remove('hidden');
            resizeDrawCanvas();
            sound.playBubble(1.1);
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            drawingModal.classList.add('hidden');
        });

        document.getElementById('spawnFishBtn').addEventListener('click', () => {
            const sprite = extractTrimmedFishSprite();
            if (!sprite) {
                showToast('Gambar ikan dulu di kanvas.');
                return;
            }

            const sx = (Math.random() - 0.5) * 10;
            const sy = (Math.random() - 0.3) * 6;
            const sz = (Math.random() - 0.5) * 8;

            const newFish = new SwimmingFish3D(sprite, sx, sy, sz);
            fishes3D.push(newFish);
            updateFishCounter();

            for (let i = 0; i < 16; i++) {
                spawnBubble3D(
                    sx + (Math.random() - 0.5) * 2.5,
                    sy + (Math.random() - 0.5) * 2.0,
                    sz + (Math.random() - 0.5) * 2.5,
                    0.1 + Math.random() * 0.16
                );
            }

            sound.playSplashSpawn();
            drawingModal.classList.add('hidden');
            clearDrawingBoard();
            showToast('Ikan dilepaskan ke kolam!');
        });

        let pointerDownPos = { x: 0, y: 0 };
        container3D.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        container3D.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dist > 6) return;

            const mouse = new THREE.Vector2(
                (e.clientX / window.innerWidth) * 2 - 1,
                -(e.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);

            if (fishes3D.length > 0) {
                const fishMeshes = fishes3D.map(f => f.mesh);
                const fishHits = raycaster.intersectObjects(fishMeshes, false);
                if (fishHits.length > 0) {
                    const hitMesh = fishHits[0].object;
                    const idx = fishes3D.findIndex(f => f.mesh === hitMesh);
                    if (idx !== -1) {
                        setFollowedFish(idx);
                        sound.playBubble(1.3);
                        showToast(`Mengikuti Ikan #${idx + 1}`);
                        return;
                    }
                }
            }

            const targetPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const hitPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(targetPlane, hitPoint)) {
                const clampedX = Math.max(-POND.width * 0.42, Math.min(POND.width * 0.42, hitPoint.x));
                const clampedY = Math.max(POND.floorY + 2.5, Math.min(POND.surfaceY - 0.5, hitPoint.y));
                const clampedZ = (Math.random() - 0.5) * 6;
                dropFood3DAt(clampedX, clampedY, clampedZ);
            }
        });

        document.getElementById('followFishBtn').addEventListener('click', () => {
            if (fishes3D.length === 0) {
                showToast('Belum ada ikan di kolam.');
                return;
            }
            const nextIdx = (followedFishIndex + 1) % fishes3D.length;
            setFollowedFish(nextIdx);
            sound.playBubble(1.25);
            showToast(`Mengikuti Ikan #${nextIdx + 1}`);
        });

        document.getElementById('dropFoodBtn').addEventListener('click', () => {
            const rx = (Math.random() - 0.5) * (POND.width * 0.6);
            const rz = (Math.random() - 0.5) * (POND.depth * 0.6);
            dropFood3DAt(rx, POND.surfaceY - 0.6, rz);
            if (fishes3D.length === 0) {
                showToast('Makanan ditabur! Gambar ikan dulu.');
            }
        });

        document.getElementById('bubbleBurstBtn').addEventListener('click', () => {
            for (let i = 0; i < 25; i++) {
                spawnBubble3D(
                    (Math.random() - 0.5) * POND.width * 0.85,
                    POND.floorY + Math.random() * 1.5,
                    (Math.random() - 0.5) * POND.depth * 0.85,
                    0.12 + Math.random() * 0.22
                );
            }
            sound.playBubble(0.95);
        });

        document.getElementById('resetCamBtn').addEventListener('click', () => {
            resetCameraPosition();
            sound.playBubble(1.1);
            showToast('Kamera direset.');
        });

        document.getElementById('clearPondBtn').addEventListener('click', () => {
            if (fishes3D.length === 0) {
                showToast('Kolam sudah kosong.');
                return;
            }
            setFollowedFish(-1);
            fishes3D.forEach(f => f.dispose());
            fishes3D.length = 0;

            foods3D.forEach(f => scene.remove(f.mesh));
            foods3D.length = 0;

            updateFishCounter();
            sound.playBubble(0.75);
            showToast('Kolam dikosongkan.');
        });

        document.getElementById('toggleSoundBtn').addEventListener('click', () => {
            const isMuted = sound.toggleMute();
            document.getElementById('soundIconOn').classList.toggle('hidden', isMuted);
            document.getElementById('soundIconOff').classList.toggle('hidden', !isMuted);
            showToast(isMuted ? 'Suara mati' : 'Suara aktif');
        });

        window.onload = function () {
            initThreeJSAquarium();
            resizeDrawCanvas();
            drawPresetFish(0);
            animate();
        };
    </script>
</body>
</html>
